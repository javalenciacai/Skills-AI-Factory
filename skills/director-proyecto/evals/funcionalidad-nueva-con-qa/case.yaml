schema_version: "1.1"
name: funcionalidad-nueva-con-qa
expected_outcome: |
  El director detecta el entorno y el multiplexor, no escribe código, ubica el pedido en la Fase 1 o 2 del proceso, presenta un plan por fases con roles y modelos (sin usar el nivel grande para todo), abre roles en paneles y worktrees separados, exige casos de prueba antes de codificar, verificación independiente y veredicto de QA, pide aprobación antes de fusionar o entregar, y cierra paneles y worktrees al terminar.
